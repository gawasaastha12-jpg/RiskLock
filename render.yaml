services:
  # -------------------------------------------------------------
  # RiskLock Backend API (FastAPI Web Service)
  # -------------------------------------------------------------
  - type: web
    name: risklock-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DEMO_ACCOUNTS
        value: "false"
      - key: SESSION_SECRET_KEY
        sync: false
      - key: SESSION_TTL_SECONDS
        value: "7200"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"

  # -------------------------------------------------------------
  # RiskLock Frontend (React + Vite Static Site)
  # -------------------------------------------------------------
  - type: static_site
    name: risklock-frontend
    plan: free
    region: oregon
    branch: main
    rootDir: frontend_v2
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/public
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
